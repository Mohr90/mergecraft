[package]
name = "mergecraft"
version = "1.4.2"
description = "Mergecraft - Git-Client mit 3-Wege-Merge-Editor"
edition = "2021"
license = "MIT"
repository = "https://github.com/Mohr90/mergecraft"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
gtk = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
mergecraft-core = { path = "../core" }

reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
semver = "1"
