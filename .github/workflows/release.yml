name: Release
on:
  push:
    tags: ['v[0-9]*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag to validate and publish (leave empty for build-only)'
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false
jobs:
  build:
    name: Validate, test and build release
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - name: Install desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libwebkit2gtk-4.1-dev libgtk-3-dev libssl-dev libxdo-dev libayatana-appindicator3-dev librsvg2-dev xvfb
      - run: npm ci
      - name: Check release versions and tag
        run: node scripts/check-release.mjs
        env:
          RELEASE_TAG: ${{ inputs.tag || (github.ref_type == 'tag' && github.ref_name || '') }}
      - run: npm run typecheck
      - run: cargo test --locked --workspace
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npm run build -- --bundles deb
      - name: Native language and window tests
        # Xvfb runners have no hardware compositor. Keep sandboxing enabled.
        env:
          WEBKIT_DISABLE_COMPOSITING_MODE: '1'
          WEBKIT_DISABLE_DMABUF_RENDERER: '1'
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          python3 tests/native-i18n.py target/release/mergecraft
          python3 tests/native-close.py target/release/mergecraft
      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          cp target/release/bundle/deb/*.deb release-assets/
          cp target/release/mergecraft release-assets/mergecraft-linux-x86_64
          (cd release-assets && sha256sum *.deb mergecraft-linux-x86_64 > SHA256SUMS.txt)
          node scripts/release-notes.mjs release-assets/RELEASE_NOTES.md
      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: release-assets/
          if-no-files-found: error
  publish:
    name: Publish verified release
    needs: build
    if: github.ref_type == 'tag' || inputs.tag != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: release-assets
      - name: Publish after all checks succeed
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" --verify-tag --draft --title "Mergecraft $RELEASE_TAG" --notes-file release-assets/RELEASE_NOTES.md
          gh release upload "$RELEASE_TAG" release-assets/*.deb release-assets/mergecraft-linux-x86_64 release-assets/SHA256SUMS.txt
          gh release edit "$RELEASE_TAG" --draft=false --latest
