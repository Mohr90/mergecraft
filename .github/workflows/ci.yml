name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core:
    name: Rust core and real Git workflows
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - run: cargo test --locked -p mergecraft-core
  interface:
    name: TypeScript and browser workflows
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build:web
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
  linux:
    name: Linux desktop build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libwebkit2gtk-4.1-dev libgtk-3-dev libssl-dev libxdo-dev libayatana-appindicator3-dev librsvg2-dev xvfb
      - run: npm ci
      - run: cargo test --locked -p mergecraft
      - run: npm run build -- --bundles deb
      - name: Native language and window tests
        env:
          WEBKIT_DISABLE_COMPOSITING_MODE: '1'
          WEBKIT_DISABLE_DMABUF_RENDERER: '1'
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          python3 tests/native-i18n.py target/release/mergecraft
          python3 tests/native-close.py target/release/mergecraft
      - uses: actions/upload-artifact@v4
        with:
          name: mergecraft-linux-deb
          path: target/release/bundle/deb/*.deb
          if-no-files-found: error
